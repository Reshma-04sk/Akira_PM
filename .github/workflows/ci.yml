name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          cd apps/backend
          uv sync --frozen

      - name: Run Ruff Linter
        run: |
          cd apps/backend
          uv run ruff check .

      - name: Run Ruff Formatter Check
        run: |
          cd apps/backend
          uv run ruff format --check .

      - name: Run Tests
        env:
          ENV_STATE: testing
          BACKEND_SECRET_KEY: test_secret_key_placeholder_do_not_use_in_prod_12345
        run: |
          cd apps/backend
          uv run pytest

  frontend-checks:
    name: Frontend Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Install Dependencies
        run: |
          cd apps/frontend
          pnpm install

      - name: Run ESLint
        run: |
          cd apps/frontend
          pnpm lint

      - name: Run TypeScript Compile Check
        run: |
          cd apps/frontend
          pnpm tsc --noEmit

      - name: Run Vitest Unit Tests
        run: |
          cd apps/frontend
          pnpm test

      - name: Verify Build
        env:
          VITE_API_URL: https://api.akira-pm.com/api/v1
        run: |
          cd apps/frontend
          pnpm build
