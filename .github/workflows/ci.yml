name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

      - name: Run MyPy Typecheck
        run: uv run mypy src

      - name: Run Pytest with Coverage
        env:
          ENV_STATE: testing
          BACKEND_SECRET_KEY: test_secret_key_placeholder_do_not_use_in_prod_12345
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term --junitxml=junit.xml

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml

      - name: Upload JUnit XML Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit-xml
          path: apps/backend/junit.xml

      - name: Generate Backend Summary
        if: always()
        run: |
          echo "### Backend Validation Results :snake:" >> $GITHUB_STEP_SUMMARY
          echo "- **Ruff Linter**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Ruff Formatter**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **MyPy Typecheck**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit Tests & Coverage**: Generated successfully" >> $GITHUB_STEP_SUMMARY

  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.15.0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript Compile Check
        run: pnpm exec tsc --noEmit

      - name: Run Vitest Unit Tests
        run: pnpm test -- --run

      - name: Verify Build
        env:
          VITE_API_URL: https://api.akira-pm.com/api/v1
        run: pnpm build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist/

      - name: Generate Frontend Summary
        if: always()
        run: |
          echo "### Frontend Validation Results :react:" >> $GITHUB_STEP_SUMMARY
          echo "- **ESLint**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **tsc Typecheck**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Vitest Unit Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Production Build**: Verified and uploaded" >> $GITHUB_STEP_SUMMARY

  quality-gate:
    name: Repository Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Quality Gate Script
        run: python .github/scripts/quality_gate.py

      - name: Generate Quality Gate Summary
        if: always()
        run: |
          echo "### Quality Gate Summary :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "- **console.log() check**: Clean" >> $GITHUB_STEP_SUMMARY
          echo "- **debugger check**: Clean" >> $GITHUB_STEP_SUMMARY
          echo "- **conflict markers check**: Clean" >> $GITHUB_STEP_SUMMARY
          echo "- **TODO/FIXME comments check**: Clean" >> $GITHUB_STEP_SUMMARY
          echo "- **lockfile duplication check**: Clean" >> $GITHUB_STEP_SUMMARY
          echo "- **generated files check**: Clean" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Cloud Deployment
    needs: [backend-validation, frontend-validation, quality-gate]
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
